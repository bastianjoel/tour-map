<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>
  <body style="margin: 0; padding: 0">
    <div id="map" style="height: 100vh; width: 100vw"></div>
  </body>
  <script id="tour-data" type="application/json">
    {{.Waypoints}}
  </script>
  <script id="image-data" type="application/json">
    {{.Images}}
  </script>
  <script>
    const map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const path = L.featureGroup().addTo(map);
    const initialTourData = document.getElementById('tour-data').textContent || '[]';
    const segments = JSON.parse(initialTourData);

    function drawSegments(segs) {
      path.clearLayers();
      if (!Array.isArray(segs)) return;
      for (const segment of segs) {
        if (Array.isArray(segment) && segment.length >= 1) {
          L.polyline(segment, {
            color: "red"
          }).addTo(path);
        }
      }
    }

    drawSegments(segments);

    if (path.getLayers().length > 0) {
      try {
        const bounds = path.getBounds();
        if (bounds.isValid()) {
          map.fitBounds(bounds, {
            animate: false,
            padding: [20, 20],
          });
        }
      } catch (e) {
        console.error('Error fitting bounds:', e);
      }
    }

    const initialImageData = document.getElementById('image-data').textContent || '{}';
    const images = JSON.parse(initialImageData);
    const imageMarkers = {};

    function drawImages(imgs) {
      if (!imgs || typeof imgs !== 'object') return;
      for (const [filename, coords] of Object.entries(imgs)) {
        if (!imageMarkers[filename]) {
          const marker = L.marker(coords).addTo(map);
          marker.bindPopup(`<a href='/images/${filename}' target='_blank'><img src='/images/${filename}' style='max-width:50vh; max-height:50vw;' /></a>`, { maxWidth: "auto" });
          imageMarkers[filename] = marker;
        }
      }
    }

    drawImages(images);

    // Fetch page and update map every 30 seconds
    let currentSegmentsJSON = initialTourData;
    function updateMap() {
      fetch(window.location.href)
        .then(response => response.text())
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          const tourEl = doc.getElementById('tour-data');
          const imageEl = doc.getElementById('image-data');

          if (!tourEl || !imageEl) return;

          const newTourData = tourEl.textContent;
          const newImageData = imageEl.textContent;

          // Update path if changed
          if (newTourData !== currentSegmentsJSON) {
            currentSegmentsJSON = newTourData;
            const newSegments = JSON.parse(newTourData || '[]');
            drawSegments(newSegments);
          }

          // Update images
          const newImages = JSON.parse(newImageData || '{}');
          drawImages(newImages);
        })
        .catch(error => console.error('Error fetching updated data:', error));
    }

    setInterval(updateMap, 30000); // Update every 30 seconds
  </script>
</html>
