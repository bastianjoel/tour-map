<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Map</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
  </head>
  <body style="margin: 0; padding: 0">
    <div id="map" style="height: 100vh; width: 100vw"></div>
  </body>
  <script id="tour-data" type="application/json">
    {{.Waypoints}}
  </script>
  <script id="image-data" type="application/json">
    {{.Images}}
  </script>
  <script>
    const map = L.map('map').setView([51.505, -0.09], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Canvas renderer for optimal polyline rendering performance
    const canvasRenderer = L.canvas();

    const path = L.featureGroup().addTo(map);
    let segments = JSON.parse(document.getElementById('tour-data').textContent || '[]');
    let images = JSON.parse(document.getElementById('image-data').textContent || '{}');
    const imageMarkers = {};
    let lastUpdateTime = new Date().toISOString();

    function drawSegments(segs) {
      path.clearLayers();
      if (!Array.isArray(segs)) return;
      for (const segment of segs) {
        if (Array.isArray(segment) && segment.length >= 1) {
          L.polyline(segment, {
            color: "red",
            renderer: canvasRenderer
          }).addTo(path);
        }
      }
    }

    function fitMapBounds() {
      if (path.getLayers().length > 0) {
        try {
          const bounds = path.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds, {
              animate: false,
              padding: [20, 20],
            });
          }
        } catch (e) {
          console.error('Error fitting bounds:', e);
        }
      }
    }

    function drawImages(imgs) {
      if (!imgs || typeof imgs !== 'object') return;
      for (const [filename, coords] of Object.entries(imgs)) {
        if (!imageMarkers[filename]) {
          const marker = L.marker(coords).addTo(map);
          marker.bindPopup(`<a href='/images/${filename}' target='_blank'><img src='/images/${filename}' style='max-width:50vh; max-height:50vw;' /></a>`, { maxWidth: "auto" });
          imageMarkers[filename] = marker;
        }
      }
    }

    // Initial render
    drawSegments(segments);
    fitMapBounds();
    drawImages(images);

    // Optimized incremental updates using the /api/updates endpoint
    function updateMap() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code') || '';
      const apiUrl = `/api/updates?since=${encodeURIComponent(lastUpdateTime)}&code=${encodeURIComponent(code)}`;

      fetch(apiUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          return response.json();
        })
        .then(data => {
          if (data.waypoints && data.waypoints.length > 0) {
            // Full refresh of segments on update
            fetch(`/?code=${encodeURIComponent(code)}`)
              .then(res => res.text())
              .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const tourEl = doc.getElementById('tour-data');
                if (tourEl) {
                  segments = JSON.parse(tourEl.textContent || '[]');
                  drawSegments(segments);
                  fitMapBounds();
                }
              })
              .catch(err => console.error('Error refreshing path:', err));
          }

          if (data.images) {
            drawImages(data.images);
          }

          if (data.lastModified) {
            lastUpdateTime = data.lastModified;
          }
        })
        .catch(error => {
          console.error('Error fetching updates:', error);
        });
    }

    setInterval(updateMap, 30000); // Update every 30 seconds
  </script>
</html>
