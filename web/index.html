<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tour Map</title>
  </head>
  <body>
    <div id="map"></div>

    <div id="toast"></div>

    <!-- Fullscreen Tour Gallery Modal -->
    <div id="gallery-modal">
      <div class="gallery-header">
        <div class="gallery-info">
          <div id="gallery-counter" class="gallery-counter">Photo 1 of 1</div>
          <div id="gallery-date" class="gallery-date">Date</div>
        </div>
        <div class="gallery-actions">
          <button id="gallery-focus-btn" class="gallery-focus-btn">
            📍 Focus on Map
          </button>
          <button
            id="gallery-close-btn"
            class="gallery-close-btn"
            title="Close (Esc)"
          >
            ✕
          </button>
        </div>
      </div>

      <div class="gallery-main">
        <button
          id="gallery-prev-btn"
          class="gallery-nav-btn gallery-nav-prev"
          title="Previous (Left Arrow)"
        >
          ‹
        </button>
        <div class="gallery-img-container">
          <img
            id="gallery-main-img"
            class="gallery-main-img"
            src=""
            alt="Tour Image"
          />
        </div>
        <button
          id="gallery-next-btn"
          class="gallery-nav-btn gallery-nav-next"
          title="Next (Right Arrow)"
        >
          ›
        </button>
      </div>

      <div class="gallery-thumbs-wrapper">
        <div id="gallery-thumbs" class="gallery-thumbs"></div>
      </div>
    </div>

    <script id="tour-data" type="application/json">
      {{.Waypoints}}
    </script>
    <script id="image-data" type="application/json">
      {{.Images}}
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
